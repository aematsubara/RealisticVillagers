# NOTE: Some options will take effect after the entities are unloaded and loaded back to the world.
# It is recommended to restart the server for the changes to take effect (don't be lazy :P).
#
# NOTES:
# 1 second = 20 ticks
# Chances range from 0.0 to 1.0.
#
# ITEM FORMAT:
# @url: the URL of the texture to be used (@material should be PLAYER_HEAD).
# @material: the material of the item.
# @model-data: the custom model data id, used for custom resource packs.
# @display_name & lore: self-explanatory.
# @crafting.shaped: whether the item recipe is shaped (like WORKBENCH) or not (like FLINT_AND_STEEL).
# @crafting.ingredients: the ingredients that'll be used for the recipe. Format: MATERIAL_NAME, KEY (used for shape, see below).
# @crafting.shape: the shape that'll be used on the crafting table, using the KEY specified (only 3 lines required, spaces are used as AIR).
# @flags: which attributes to hide.
# @enchantments: the enchantments to be applied.
# @leather-color: the color of the leather armor.
# * Use a color from: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Color.html (e.g. AQUA, BLACK, etc.)
# * Use a random color with: $RANDOM
# * Use a color using RGB format: &#RRGGBB
# @damage: the amount of damage to apply to the item (maximum durability - given damage, can be $RANDOM or X-Y).
# @tipped: the potion effect the arrow will have (must be a TIPPED_ARROW).
# @amount: the amount of items.
#
# FOR FIREWORKS:
# @firework.power: the approximate power of the firework. Each level of power is half a second of flight time (from 0 to 127).
# firework-effects: a list of effects.
# firework-effects.x.type: the type or shape of the effect.
# firework-effects.x.flicker: whether the firework effect should flicker.
# firework-effects.x.trail: whether the firework effect should have a trail.
# firework-effects.x.colors: several primary colors to the firework effect.
# firework-effects.x.fade-colors: several fade colors to the firework effect.
# NOTE: More firework effects (firework stars) = more damage.
#
# $RANDOM:
# Color: a random color. (@leather-color / @firework.firework-effects.x.colors/fade-colors)
# PotionType: a random potion effect. (@tipped)
# FireworkEffect.Type: a random type or shape. (@firework.firework-effects.x.type)
# For @damage, a random value between 1 and max item durability is used.
#
# RANGED AMOUNT (X-Y): A random value between x and y. (@amount / @enchantments (level) / @firework.power)
#
# PERCENTAGE (only valid for @damage, NOT DECIMAL): X% / %X (% must be included); for example, 50% (same as %50) would be half-damage.
# NOTE: The percentage is taken from the maximum durability; this means:
# * WOODEN_SWORD max durability = 60; if @damage is 50% (60 * 0.50) -> 30. if @damage is 25% (60 * 0.25) -> 15.
# That value will be the damage added to the item; so, if @damage is %25, the new durability of the WOODEN_SWORD will be 60 - 15 = 45.
#
# In this example, the required ingredients are 7 of GOLD_INGOT and 1 of DIAMOND.
# You can use spaces to represent AIR (nothing).
# ingredients:
#   - DIAMOND, D
#   - GOLD_INGOT, G
# shape:
#   - "GDG"
#   - "G G"
#   - "GGG"
#
# USEFUL LINKS:
#
# Materials: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
# Flags: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/inventory/ItemFlag.html
# Professions: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/Villager.Profession.html
# Enchantments: https://www.digminecraft.com/lists/enchantment_list_pc.php
# Colors: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Color.html
# FireworkEffect.Type: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/FireworkEffect.Type.html
# Effects: https://www.digminecraft.com/lists/effect_list_pc.php

# Don't touch this!
config-version: 6

# The rendering distance of the villagers.
render-distance: 56

# To generate skins faster, you will need to create your own api-key on the mineskin page.
# NOTE: If empty, no api-key will be used, so it'll take longer to generate skins (NOT RECOMMENDED).
# NOTE 2: DON'T log in with your microsoft account, this is to contribute with a minecraft account to make the requests faster.
# NOTE 3: You should only log in with your Google account. If you have problems, try clearing your cookies and try the steps again.
#
# To create an api-key, follow the steps below:
# * Go to https://mineskin.org/account first.
# * You must have a Google account, then click on "Continue as X".
# * Cloudflare will perform a secure connection check, wait.
# * If the page just keeps refreshing, go to https://mineskin.org/ and then do the next step, you should already be logged in.
# * Once you've logged in, go to https://mineskin.org/account again.
# * Under "API Keys" click on "Manage api keys".
# * In "Action", select "Create a new API Key".
# * Now, you only have to define the name of the api-key, you can give it any name you want.
# * Scroll down and click on the "Create" button.
# * That's it, now, you just have to save the name, the api-key and the key-secret, so you don't lose it.
# * Paste the api-key down here and do /rv reload.
mineskin-api-key: ""

# If you only want villagers to look like players, spawn with weapons and attack, you can disable all interactions.
disable-interactions: false

# The maximum amount of gossip a villager shares with another villager.
max-gossip-topics: 10

# These are set based on the player's reputation and if the player is the hero of the village.
disable-special-prices: false

# If a player has a monster head equipped, the villager will attack him.
# Heads: DRAGON_HEAD / WITHER_SKELETON_SKULL / ZOMBIE_HEAD / SKELETON_SKULL / CREEPER_HEAD
attack-player-wearing-monster-skull: true

# If a player plays the goat horn "seek" (same sound as in raids), the villager will attack him (1.19+).
attack-player-playing-goat-horn-seek: true

# The distance at which villagers can hear the goat horn (1.19+).
goat-horn-seek-range: 32

# If the villager must defend a family member (only if the villager has a weapon).
villager-defend-family-member: true

# If the villager must defend the hero of the village (only if the villager has a weapon).
# NOTE: A player is considered the hero of the village if he has the effect HERO_OF_THE_VILLAGE or
# if he has killed at least one raider and will receive this effect if the defense is successful.
villager-defend-hero-of-the-village: true

# If the villager must defend the following player (only if the villager has a weapon).
villager-defend-following-player: true

# Whether villagers must defend players from attacks by other players.
# NOTE: At least one of the 3 previous options must be enabled.
villager-defend-attack-players: false


# Body traits: every villager her own height and build, women a figure drawn from their own skin.
#
# The shapes live in a resource pack the plugin writes and then hands to players itself, so there
# is nothing to host and nothing to paste into server.properties. It is added alongside whatever
# pack the server already sends, not in place of it, and arrives in the time it takes to download.
appearance:
  # Draw body shapes at all. Off leaves everyone the plain player model; heights still vary.
  body-shapes: true
  # Give women a bust. Villagers and players both, each drawn from her own skin.
  bust: true
  # Add weight to whoever carries it. This one is not about women: roughly two thirds of everyone,
  # men included, is heavy enough for it to show, and it sits on the belly rather than the chest.
  # Turn it off if you would rather nobody had a stomach.
  build: true
  # Whether players get a figure too, or only villagers.
  players: true

  serve-pack: true
  # Port the pack is served on. Must be reachable by players, like the game port itself.
  pack-port: 25580
  # Address players should fetch it from. "auto" uses the server's own, which is right on a home
  # network and wrong behind a proxy or a host that gives you a different public address.
  pack-host: auto

# Villager name tags.
nametags:
  # Show a villager's name only to the player looking at it.
  #
  # A settlement of forty villagers is forty name tags in the air at once, drawn through walls
  # and through each other - so the more alive a village is, the less of it you can see. This
  # answers "who is this" at the moment the question is actually being asked.
  #
  # Off by default: always-visible name tags are what most servers expect, and this changes
  # something players look at constantly.
  only-when-looking: false
  # How far away a villager can be and still have its name shown, in blocks.
  look-range: 12.0


# If true, arrows shot by villagers will pass through other villagers.
# NOTE: This should always be true to prevent them from killing each other by accident.
arrows-pass-through-other-villagers: true

# Whether it's allowed to pick arrows shot by villagers (DISALLOWED/ALLOWED/CREATIVE_ONLY).
arrow-status: ALLOWED

# The waiting time between melee attacks (in ticks).
melee-attack-cooldown: 10

# Whether villagers can fix iron golems if they have iron ingot(s) in hand.
villager-fix-iron-golem-with-iron: true

# The waiting time to fix a golem again (in ticks). Use 0 or lower to set no limit.
villager-fix-iron-golem-cooldown: 600

# Whether villagers can help family members (only players ATM).
villager-help-family: true

# Whether new villagers should automatically receive family relationships from nearby villagers on spawn.
auto-assign-family: true

# The waiting time to help a family member again (in ticks). Use 0 or lower to set no limit.
villager-help-family-cooldown: 600

# Whether villagers can spawn iron golems when needed.
# NOTE: True by default, but should be considered since villagers can defend themselves.
villager-spawn-iron-golem: true

# If a player hits a villager (accidentally or not) during a raid, the villager will defend himself.
# NOTE: If false, the reputation towards the player will not be reduced; however, if the villager dies,
# it will lower the reputation with nearby villagers.
villager-attack-player-during-raid: false

# If a player hits an iron golem (accidentally or not) during a raid, the golem will defend himself.
iron-golem-attack-player-during-raid: false

# Reputation required to marry a villager.
reputation-required-to-marry: 75

# Reputation required to procreate with a villager.
reputation-required-to-procreate: 110

# Here you can apply a reputation loss to a player for repeatedly interacting with a villager to the point of annoying them.
annoying-meter:
  # Whether the annoying-meter system is enabled.
  enabled: true
  # If true, players who are considered family of the villager won't trigger the annoying-meter.
  ignore-family-members: true
  # If true, the counter will be reset after a good interaction with this villager.
  clear-after-success-interaction: true
  # How many right-clicks are allowed before the villager becomes annoyed?
  max-clicks: 10
  # Time frame (in seconds) in which the clicks are counted.
  # Example: 30 = more than 10 clicks in 30 seconds = annoyed villager.
  timeframe: 30
  # How many reputation points the player loses when they annoy a villager.
  reputation-loss: 2
  # Whether to spawn angry particles above the villager.
  angry-particles: true

# Settlement system: groups villagers into villages that can have a mayor, hold shared
# resources and commission buildings. Villages are detected automatically from the village
# bell, and can be fine-tuned afterwards through the mayor's menu.
village:
  # Whether the settlement system is enabled at all.
  enabled: true
  # Default village radius in blocks, measured horizontally from the bell.
  # A village covers the full height of its area, so basements and rooftops still count.
  # The mayor's menu can override this per village.
  default-radius: 64
  # Divisor X in the mayor reputation formula: R_mayor = (sum of reputation with every
  # resident) / X. Reputation with the mayor itself is excluded — you earn standing with
  # the mayor by dealing well with ordinary residents, never by talking to the mayor.
  # LOWER value = reputation grows FASTER. Note the sum scales with village size, so large
  # settlements reach high mayor reputation more easily; raise X to compensate.
  mayor-reputation-divisor: 10
  # How often (in seconds) village data is written to villages.yml.
  save-interval: 300

  # ── Performance ──────────────────────────────────────────────────────────
  # Finding a village's residents is an entity query, and menus, reputation maths and the
  # election loop all need it. These two settings keep that cost under control.

  # How far up and down from the bell to look for residents, in blocks. Villages are
  # surface-level in practice; raising this a lot makes the query markedly more expensive.
  vertical-range: 64

  # How long (in milliseconds) a resident lookup is reused before querying the world again.
  # Higher = cheaper but slower to notice a villager walking in or out. Lower it only if you
  # need near-instant reactions and can spare the performance.
  resident-cache-millis: 2000

  # ── Building detection ───────────────────────────────────────────────────
  # The radar finds buildings by ruling out nature: any solid block that isn't ordinary
  # terrain counts as something a builder placed. That way igloos, datapack structures and
  # anything else are all picked up without having to be listed anywhere.
  #
  # These two lists let you correct that judgement for blocks it gets wrong — most likely
  # blocks added by a datapack or another plugin. Use Minecraft material names.
  building-materials:
    # Force these to count as part of a building, even if they look natural.
    # Example: - SNOW_BLOCK
    building: []
    # Force these to count as terrain, so they never create a phantom building.
    # Example: - PACKED_ICE
    natural: []

  mayor:
    # Reputation with the mayor a player needs before it will accept a building
    # commission. Remember this is the derived value from the formula above, not the
    # reputation shown for an individual villager.
    reputation-required-to-commission: 50
    # Whether the player must also have a family (be partnered to one of this village's
    # residents) before commissioning buildings.
    require-family: true

    # Block shown floating above the mayor's head, the way other villagers show their
    # workstation. The mayor has no workstation of its own, so this stands in as its badge
    # of office. Must be a placeable block; falls back to EMERALD_BLOCK if invalid.
    head-block: EMERALD_BLOCK

  # When a village has no mayor (it died, or none was ever elected), an election opens
  # automatically. Candidates are drawn ONLY from unemployed residents, so no working
  # villager loses their job to run for office.
  election:
    enabled: true
    # How long voting stays open, in seconds.
    duration: 300
    # How many candidates stand. If fewer unemployed residents exist, all of them run.
    candidates: 3
    # Vote weights. A player's vote counts for more than a settler's, so players decide the
    # outcome when they take part, while an empty server still elects someone on its own.
    player-vote-weight: 5
    villager-vote-weight: 1
    # How often (in seconds) the plugin checks for vacant seats and finished elections.
    check-interval: 10

    # Texts for the ballot and the mayor's screen live in configs/gui.yml,
    # the election countdown in configs/holograms.yml, and the chat messages
    # in configs/messages/system.yml.

  # ── Settlement economy ───────────────────────────────────────────────────
  # Every villager with a trade also has a role in its settlement, and workers put what they
  # produce into the village's shared storage — the pool the mayor's screen shows and that
  # building will draw from. Which trade produces what is fixed in code:
  #
  #   Fletcher .................. logs, sticks
  #   Mason, Armorer ............ cobblestone, stone, coal, raw iron
  #   Toolsmith, Weaponsmith .... iron ingots, nuggets, coal
  #   Farmer, Butcher ........... wheat, carrots, potatoes, bread
  #   Fisherman ................. cod, salmon, string
  #   Shepherd .................. wool, string
  #   Leatherworker ............. leather, rabbit hide
  #   Librarian, Cartographer ... paper, books, sugar cane
  #   Cleric .................... redstone, glowstone dust, lapis
  #
  # A villager only produces while it is actually at work: it must have a workstation, be
  # near it, and it must be daytime. The mayor governs instead of working a trade.
  economy:
    enabled: true
    # How often (in seconds) a production round runs.
    interval: 60
    # Chance (0.0-1.0) that a given worker contributes in a given round. Below 1 so a large
    # settlement's output stays uneven rather than arriving in one lump every minute.
    chance: 0.5
    # How much one contribution is worth.
    min-amount: 1
    max-amount: 3

  # ── Settlement names ─────────────────────────────────────────────────────
  # A settlement is named when it is first found, from the biome it stands in: one word
  # from "first" joined to one from "second" — Sunreach, Frosthold, Mirewater. The name is
  # then saved with the village, so editing these lists renames nothing that already
  # exists; it only changes what future settlements are called. Any village can be renamed
  # by hand at any time from the mayor's menu.
  #
  # Groups are matched against the biome name by substring, so variants a Minecraft update
  # adds (snowy_taiga, windswept_savanna, sparse_jungle) fall into the right group on their
  # own. Delete a group to fall back to the built-in words for it.
  names:
    desert:
      first:  [Sun, Dust, Amber, Scorch, Mirage, Gold, Ash, Dune]
      second: [reach, hollow, rest, gate, spire, crest, haven, watch]
    snow:
      first:  [Frost, White, Pale, Winter, Ice, Still, Hollow, North]
      second: [hold, fell, reach, barrow, crown, watch, rest, mere]
    savanna:
      first:  [Acacia, Ember, Wide, Long, Bright, Dry, Sun, Red]
      second: [plain, run, field, stead, ridge, reach, gate, vale]
    taiga:
      first:  [Pine, Elk, Deep, Green, Wolf, Moss, Fern, Grey]
      second: [wood, hollow, lodge, fall, grove, hearth, marsh, burn]
    jungle:
      first:  [Vine, Emerald, Deep, Cloud, Parrot, Fern, Green, Rain]
      second: [canopy, hollow, temple, reach, shade, spring, root, veil]
    swamp:
      first:  [Mire, Black, Willow, Fog, Reed, Damp, Toad, Murk]
      second: [water, marsh, hollow, bank, fen, rest, crossing, bog]
    # Anything that matches none of the above.
    plains:
      first:  [Green, Oak, Fair, Mill, Bright, Wheat, Stone, River]
      second: [field, brook, stead, ford, meadow, hill, bridge, crossing]

  # ── Graves ───────────────────────────────────────────────────────────────
  # A villager that dies without a cross gets a headstone where it fell, carrying its name,
  # its parents and what killed it. A cross means it can be revived, so those are skipped -
  # a headstone over somebody who is coming back is a lie the world keeps telling.
  #
  # Headstones are display entities, not blocks: they can be removed cleanly, never get in
  # anybody's way, and cost the world nothing. The text is in configs/messages/system.yml.
  graves:
    enabled: true

  # ── Refining ─────────────────────────────────────────────────────────────
  # Workers turn what they gather into what the settlement can build with.
  #
  # This is what makes building possible at all. Gathering alone produces logs, stone, sand
  # and ore, while even the simplest blueprint wants planks, stairs, a door and glass — so
  # without these recipes the stores fill with raw goods nobody can spend.
  #
  #   result       what comes out.
  #   amount       how many, per run.
  #   ingredients  what goes in, and how many of each.
  #   role         which trade does the work. Omit it and any working villager will.
  #                One of: lumberjack, miner, blacksmith, food-supplier, fisher,
  #                weaver, tanner, scholar, apothecary.
  #
  # Each recipe runs at most ONCE per economy round, and only while the settlement holds at
  # least three times an ingredient — so raw goods are refined steadily out of a surplus
  # rather than the whole stock being converted the moment it crosses the line.
  crafting:
    recipes:
      # Woodwork
      - result: OAK_PLANKS
        amount: 4
        role: lumberjack
        ingredients: {OAK_LOG: 1}
      - result: OAK_STAIRS
        amount: 4
        role: lumberjack
        ingredients: {OAK_PLANKS: 6}
      - result: OAK_DOOR
        amount: 3
        role: lumberjack
        ingredients: {OAK_PLANKS: 6}
      - result: OAK_FENCE
        amount: 3
        role: lumberjack
        ingredients: {OAK_PLANKS: 4, STICK: 2}

      # Stonework
      - result: STONE_BRICKS
        amount: 4
        role: miner
        ingredients: {STONE: 4}
      - result: COBBLESTONE_STAIRS
        amount: 4
        role: miner
        ingredients: {COBBLESTONE: 6}
      - result: COBBLESTONE_WALL
        amount: 6
        role: miner
        ingredients: {COBBLESTONE: 6}
      # Sand is fired into glass, so the miner needs fuel as well as sand.
      - result: GLASS
        amount: 1
        role: miner
        ingredients: {SAND: 1, COAL: 1}
      - result: GLASS_PANE
        amount: 16
        role: miner
        ingredients: {GLASS: 6}

      # Metalwork and light
      - result: IRON_INGOT
        amount: 1
        role: blacksmith
        ingredients: {RAW_IRON: 1, COAL: 1}
      - result: TORCH
        amount: 4
        role: blacksmith
        ingredients: {COAL: 1, STICK: 1}

  # ── Building commissions ─────────────────────────────────────────────────
  # Buildings are defined in configs/blueprints.yml and paid for out of the settlement's
  # stores. Players need standing with the mayor first — operators, and anyone with the
  # permission realisticvillagers.village.bypass, do not.
  build:
    # Refuse to place a building on or beside one that already exists.
    #
    # Worth keeping on for more than tidiness: the scanner finds buildings by walking
    # connected blocks, so two that share a wall are read as a single building from then
    # on — by the map, by the settlement's own bounds, and by this check itself.
    collision: true
    # How much clear ground to insist on around a new building, in blocks. 1 stops walls
    # touching; 2 leaves a gap you can walk down. 0 allows buildings to touch.
    clearance: 2
    # Empty chests, barrels and furnaces as the building goes up.
    #
    # A saved building carries whatever was in its containers, so without this a house recorded
    # with a full chest is an item duplicator that runs as often as the settlement can pay for
    # the walls. Turn it off only if your buildings' contents are part of how they work.
    empty-containers: true
    # Refuse to raise a building outside the settlement paying for it. The stores belong to the
    # village, so what they buy should stand in it.
    inside-village-only: true
    # Each player only gets the buildings they discovered themselves.
    #
    # Finding a village is the interesting part, and a shared list hands everyone the reward
    # for it the moment the first player walks in - on a busy server the list would be
    # complete within a day and finding anything would stop mattering.
    #
    # It also settles who may rename what: you can rename what you found, because nobody else
    # can see it, and you cannot rename what the server provides, because it is shared.
    #
    # Set to false for one shared list, recorded the first time anybody arrives.
    personal-discovery: true
    # How many buildings one village may contribute to your blueprints.
    #
    # A settlement has a handful of shapes and then repeats them, so past a few there is
    # nothing new being learned - only more entries to scroll past. Walking into a village
    # costs a full read of every block of each building saved, which is the other reason
    # there is a number here at all.
    #
    # Raise it to take the whole village. The log says which buildings were left behind and
    # why, so a village of seven that contributed six is never a mystery.
    discovery-limit: 10
    # How fast a building goes up, in blocks a second, before the mayor's programme is applied.
    # A building's total time is its block count divided by this, so lowering it makes raising
    # anything a job the settlement visibly labours over.
    blocks-per-second: 4

    # Buildings are drawn once and dressed in whatever the local land is built from, so an oak
    # cottage comes out in sandstone in a desert and in spruce in a taiga. Only the materials
    # change — the layout, the doors and the windows stay where the blueprint put them.
    #
    # The cost changes with them: a settlement asked for sandstone is charged for sandstone.
    #
    # Groups are the same ones village names use, matched against the biome by substring.
    # Delete a group to have blueprints built exactly as they are written.
    biome-styles:
      desert:
        OAK_PLANKS: SMOOTH_SANDSTONE
        OAK_LOG: CUT_SANDSTONE
        OAK_STAIRS: SANDSTONE_STAIRS
        OAK_DOOR: ACACIA_DOOR
        OAK_FENCE: ACACIA_FENCE
        COBBLESTONE: SANDSTONE
        COBBLESTONE_STAIRS: SANDSTONE_STAIRS
        COBBLESTONE_WALL: SANDSTONE_WALL
        STONE_BRICKS: CUT_SANDSTONE
      savanna:
        OAK_PLANKS: ACACIA_PLANKS
        OAK_LOG: ACACIA_LOG
        OAK_STAIRS: ACACIA_STAIRS
        OAK_DOOR: ACACIA_DOOR
        OAK_FENCE: ACACIA_FENCE
      taiga:
        OAK_PLANKS: SPRUCE_PLANKS
        OAK_LOG: SPRUCE_LOG
        OAK_STAIRS: SPRUCE_STAIRS
        OAK_DOOR: SPRUCE_DOOR
        OAK_FENCE: SPRUCE_FENCE
      snow:
        OAK_PLANKS: SPRUCE_PLANKS
        OAK_LOG: SPRUCE_LOG
        OAK_STAIRS: SPRUCE_STAIRS
        OAK_DOOR: SPRUCE_DOOR
        OAK_FENCE: SPRUCE_FENCE
        COBBLESTONE: STONE_BRICKS
      jungle:
        OAK_PLANKS: JUNGLE_PLANKS
        OAK_LOG: JUNGLE_LOG
        OAK_STAIRS: JUNGLE_STAIRS
        OAK_DOOR: JUNGLE_DOOR
        OAK_FENCE: JUNGLE_FENCE
      swamp:
        OAK_PLANKS: MANGROVE_PLANKS
        OAK_LOG: MANGROVE_LOG
        OAK_STAIRS: MANGROVE_STAIRS
        OAK_DOOR: MANGROVE_DOOR
        OAK_FENCE: MANGROVE_FENCE

  # ── Real harvesting ──────────────────────────────────────────────────────
  # Unlike the economy above, this changes actual blocks in the world:
  #
  #   Fletchers (lumberjacks) fell a whole nearby tree and plant a sapling of the same
  #   wood where the trunk stood, so the woods around a settlement thin out and grow back.
  #
  #   Farmers, butchers and fishermen cut the head off a nearby cactus and leave the stump
  #   rooted, so it regrows on its own. Cactus is what camels are led with, so a desert
  #   settlement would otherwise strip its own supply.
  #
  # Set enabled to false if you would rather villagers never touched the terrain.
  harvest:
    enabled: true
    # How often (in seconds) a harvesting round runs. Kept slower than the economy round
    # because each one can remove a whole tree.
    interval: 45
    # Keep felling and cactus-cutting inside the settlement's own radius (village.default-radius,
    # or a mayor's override).
    #
    # A lumberjack or food supplier is only found near where it happens to be standing when its
    # turn comes up, not sent looking for a tree — so without this, a resident that wanders (or
    # is led) into a forest you planted well outside the village clears it exactly as readily as
    # the trees actually around the settlement. Turn this off only if you want harvesting to
    # follow residents wherever they roam.
    limit-to-village: true
    # Also require the tree or cactus to be within this many blocks of the worker's OWN
    # workstation — a fletching table for a lumberjack, a smoker or a composter for a food
    # supplier — not merely somewhere inside the settlement. A large village can easily hold a
    # decorative forest nowhere near where any fletcher actually works; this is what keeps
    # harvesting out of it without having to shrink the whole village's radius to do it.
    #
    # A worker with no workstation memorised right now (between jobs, or just hired) fells and
    # cuts nothing at all rather than falling back to limit-to-village alone — a job with no
    # bench is not a job yet.
    #
    # 0 turns this check off, leaving limit-to-village as the only boundary.
    workstation-radius: 24

# Here you can allow procreation between villagers of the same sex, procreation between family members and also allow "cheating" of villagers,
# i.e., allow villagers to procreate with other villagers even if they are married.
#
# By default, all these options are disabled, so it can break the functioning of villager farms.
villager-farm:
  # If true, male villagers will be able to procreate with other male villagers, the same with female villagers.
  # If false, both villagers must have a different sex.
  ignore-sex-when-procreating: false
  # If true, a villager will be able to procreate with another villager even if it is not their partner (ONLY FOR RELATIONSHIPS BETWEEN 2 VILLAGERS).
  # If false, a villager will only be able to procreate with his partner (if he has one).
  allow-partner-cheating: false
  # This option requires the one above (@allow-partner-cheating) to be true.
  # If true, a villager will be able to procreate with another villager even if they are married to a player.
  # If false, a villager will only be able to procreate with his partner (if he has one) and is a player.
  allow-partner-cheating-for-all: false
  # If true, 2 villagers from the same family can procreate with each other (WEIRD!).
  # If false, 2 villagers will not be able to procreate with each other if they are from the same family (unless they are partners).
  allow-procreation-between-family-members: false

# The reputation that will be lost after divorce. Minimum value: 2; use 1 or less to disable.
divorce-reputation-loss: 50

# The reputation that will be lost after divorce with divorce papers (given by clerics).  Minimum value: 2; use 1 or less to disable.
divorce-reputation-loss-papers: 10

# This only applies to villagers who haven't yet spawned.
# If the villager has no weapon in hand, he'll flee from danger (only with monsters).
# Entities: https://www.digminecraft.com/lists/entity_list_pc.php
default-target-entities:
  - DROWNED
  - EVOKER
  - HUSK
  - ILLUSIONER
  - PILLAGER
  - RAVAGER
  - VEX
  - VINDICATOR
  - ZOGLIN
  - ZOMBIE
  - ZOMBIE_VILLAGER
  - WARDEN

# The distance at which villagers detect hostile entities (double is used for villagers with weapons).
hostile-detection-range: 15.0

# If you want the villager to become a zombie when killed by one.
# When healed, the villager will have all his data.
zombie-infection: true

# Whether villagers should be turned into witches by being struck by lightning.
witch-convertion: true

# Whether villagers should be turned into witches by being struck by lightning from a trident with channeling thrown by a villager.
# NOTE: @witch-convertion must be true.
witch-convertion-from-villager-trident: false

# The maximum amount of health of a villager.
villager-max-health: 20

# Whether to teleport the villager to the player he's following if the distance between them is greater than X (defined below).
teleport-when-following-if-far-away: true

# If the distance between the two is greater than the given value, the villager will be teleported.
teleport-when-following-distance: 12

# The time (in ticks) that the villager waits for a gift (or a bed) from a player.
time-to-expect: 100

# Whether villagers should drop the contents of the inventory upon death.
# NOTE: Not recommended to avoid players recovering their items after giving them to the villager
# to increase reputation and abuse trade discounts.
drop-whole-inventory: false

# The time it will take for a baby to grow (in milliseconds).
baby-grow-cooldown: 1200000

# The time a villager must wait before being able to procreate again (in milliseconds).
procreation-cooldown: 1200000

# On Halloween, there's a chance that a villager will wear a pumpkin / carved pumpkin.
chance-of-wearing-halloween-mask: 0.25

# If the player's reputation is less than X, the villager will be automatically divorced.
divorce-if-reputation-is-less-than: 0

# Size of the inventory of a villager.
# Maximum size allowed: 36.
villager-inventory-size: 27

# If false, sounds will be replaced to the ones from player (if possible).
use-villager-sounds: false

# Amount of reputation when giving a wedding ring. Minimum value: 2; use 1 or less to disable.
wedding-ring-reputation: 20

# Amount of reputation when giving a cross. Minimum value: 2; use 1 or less to disable.
cross-reputation: 10

# Amount of reputation lost when giving a bad gift (item not in the gift list). Minimum value: 2; use 1 or less to disable.
bad-gift-reputation: 5

# Amount of reputation when having a baby.  Minimum value: 2; use 1 or less to disable.
baby-reputation: 20

# If jokes are always funny to the partner.
partner-joke-always-success: false

# Chance of success when interacting with a villager.
chance-of-chat-interaction-success: 0.65

# Amount of reputation for an interaction (successful or not). Minimum value: 2; use 1 or less to disable.
chat-interact-reputation: 2

# The waiting time between each interaction (in seconds).
# NOTE: @greet and @proud-of are always success, so consider putting a reasonable amount of cooldown.
# NOTE #2: for @gift, the cooldown starts after the villager picks up the gift.
interact-cooldown:
  chat: 2
  greet: 30
  story: 2
  joke: 2
  flirt: 2
  proud-of: 30
  insult: 2
  divorce-papers: 900
  gift: 600
  bed: 3

# Whether to display the title in the villager's chat messages.
# For example, James the Armorer / Juliet the Weaponsmith / etc.
show-title-in-villager-chat-message: true

# The article in the title name of the villager.
# For other languages, you can specify a different article per sex.
villager-title-article:
  male: "the"
  female: "the"

# The format of the chat when a villager speaks.
villager-message-format: "%name%: %message%"

# Here you can modify the items of the babies.
#
# Variables:
# %villager-name% - the name of the newborn baby (display-name).
# If you are using a texture-pack, you can assign the item a @model-data so that the package will recognize it.
baby:
  boy:
    material: PAPER
    display-name: "&b%villager-name%"
    lore:
      - "&7Right click to spawn this little boy!"
  girl:
    material: PAPER
    display-name: "&d%villager-name%"
    lore:
      - "&7Right click to spawn this little girl!"

# Wedding ring crafting recipe.
wedding-ring:
  url: 93af4b73349e723b8654b75f905bd38995ccbb1a434d470b06279678945ecbdb
  material: PLAYER_HEAD
  display-name: "&aWedding ring"
  lore:
    - "&7Give it to the love of your life."
  crafting:
    enabled: true
    shaped: true
    ingredients:
      - DIAMOND, D
      - GOLD_INGOT, G
    shape:
      - "GDG"
      - "G G"
      - "GGG"

# Whistle item.
whistle:
  material: IRON_INGOT
  display-name: "&bWhistle"
  lore:
    - "&7Use it to summon members of your family."
  crafting:
    enabled: true
    shaped: true
    ingredients:
      - IRON_INGOT, I
      - GOLD_BLOCK, G
    shape:
      - "   "
      - "IG "
