# ╔══════════════════════════════════════════════════════════════════════════╗
# ║   RealisticVillagers — Regional Skin Filter                              ║
# ║   Region : Swamp               Sex: Female                    ║
# ║   Style  : Southern US / Bayou                                      ║
# ╚══════════════════════════════════════════════════════════════════════════╝

# HOW THIS FILE WORKS
# ─────────────────────────────────────────────────────────────────────────
#  This file narrows which skin IDs are used for Swamp villagers.
#  It does NOT store textures — it only lists IDs from the global
#  skins/female.yml file that visually fit this region's style.
#
#  • The global female.yml has IDs 1–50 for every profession,
#    and IDs 1–50 for 'none' (adults) + 1–50 for 'none' (kids).
#
#  • Each section below is a list of IDs from the global file.
#    Only IDs present in BOTH this list AND the global file are used.
#
#  • A profession section that is missing here = all global IDs are used.
#    A profession with an empty or invalid list = all global IDs are used.
#
#  • Changes take effect on /rv reload (or server restart).
#    Already-spawned villagers keep their stored skin ID unless
#    their skin is reset via the Skin GUI or /rv skin commands.
#
# HOW TO FIND WHICH IDs FIT YOUR REGION
# ─────────────────────────────────────────────────────────────────────────
#  1. Right-click a villager → open the Info panel (Informations).
#     The hologram shows the current Skin ID next to the profession.
#  2. Use /rv skin <sex> <profession> <id> to preview any ID in-game.
#  3. Write the IDs that look 'Southern US / Bayou' in the sections below.
#  4. Remove IDs that look out of place for this region.
#
# EXAMPLE — keep only IDs 3, 7, 15 for farmers:
#   farmer:
#     - 3
#     - 7
#     - 15
#
# ─────────────────────────────────────────────────────────────────────────
# Currently ALL IDs are listed — behaviour is identical to the global file.
# Remove IDs below to restrict skin selection for Swamp villagers.
# ─────────────────────────────────────────────────────────────────────────

