# ===========================================================================
# RealisticVillagers - Villager Names
# Region : Savanna  (African / Savanna)
#
# HOW THIS FILE WORKS
# ---------------------------------------------------------------------------
# This file provides names for villagers whose biome type is SAVANNA.
# It is used only when regionality-enabled: true is set in config.yml.
#
# Fallback chain:
#   1. This file  (configs/names/savanna.yml)
#   2. configs/names/default.yml   <-- if this file has no entry for the sex
#   3. All regional files combined <-- absolute last resort
#
# FORMAT
# ---------------------------------------------------------------------------
# male:
#   - <name>
# female:
#   - <name>
#
# - Add as many names as you like under male: and female:
# - Duplicates are allowed and increase how often a name is picked.
# - Names shorter than 3 characters are skipped automatically.
# - Changes take effect on /rv reload (affects newly spawned villagers).
# ===========================================================================

