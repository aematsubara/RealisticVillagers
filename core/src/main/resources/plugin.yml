name: RealisticVillagers
version: ${project.parent.version}
author: Matsubara
main: me.matsubara.realisticvillagers.RealisticVillagers
api-version: 1.18
load: STARTUP
description: ${project.description}
depend:
  - packetevents
softdepend:
  - ProtocolLib
  - ProtocolSupport
  - ViaVersion
  - ViaBackwards
  - ViaRewind
  - Geyser-Spigot
  - ValhallaMMO

commands:
  realisticvillagers:
    description: main command.
    usage: /<command>
    aliases:
      - rv
      - rvillagers
      - realvillagers
  gender:
    description: Set your own gender.
    usage: /gender <male|female>

permissions:
  realisticvillagers.village.bypass:
    description: Commission settlement buildings without earning standing with the mayor first.
    default: op
  realisticvillagers.genderset:
    description: Allows using /rv genderset to forcibly set a villager's gender for a target player (bypasses gender lock).
    default: op